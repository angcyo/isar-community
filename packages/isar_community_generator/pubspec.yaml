name: isar_community_generator
description: Code generator for the Isar Database. Finds classes annotated with @Collection.
version: 3.3.2
repository: https://github.com/isar-community/isar-community
homepage: https://github.com/isar-community/isar-community
issue_tracker: https://github.com/isar-community/isar-community/issues
documentation: https://isar-community.dev
funding:
  - https://github.com/sponsors/vicenterusso/

environment:
  sdk: ">=3.9.0 <4.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  # https://pub.dev/packages/analyzer
  analyzer: '>=8.0.0 <15.0.0'
  # https://pub.dev/packages/source_gen
  source_gen: ^4.2.4

  # https://pub.dev/packages/build
  build: ^4.0.10
  # https://pub.dev/packages/dart_style
  dart_style: ^3.1.12
  # https://pub.dev/packages/dartx
  dartx: ^1.2.0
  # https://pub.dev/packages/glob
  glob: ^2.1.3
  # https://pub.dev/packages/isar_community
  isar_community: 3.3.2
  # https://pub.dev/packages/path
  path: ^1.9.1
  # https://pub.dev/packages/xxh3
  xxh3: ^1.2.0

dev_dependencies:
  build_test: ^3.5.19
  logging: 1.3.0
  matcher: ^0.12.20
  test: ^1.31.2
  test_api: ^0.7.13
  very_good_analysis: ^10.3.0

dependency_overrides:
  isar_community:
    path: ../isar_community
